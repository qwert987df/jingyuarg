<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>real</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }
        html,body{
            background:#000000;
            min-height:100vh;
            overflow:hidden;
            font-family: system-ui,-apple-system,"Microsoft Yahei",sans-serif;
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
        }
        .title{
            color:#ff2222;
            font-size:42px;
            margin-bottom:80px;
            text-align:center;
            font-weight:bold;
        }
        .btn-group{
            display:flex;
            gap:60px;
        }
        button{
            font-size:26px;
            padding:20px 48px;
            background:#111111;
            color:#ff2222;
            border:2px solid #ff2222;
            border-radius:8px;
            cursor:pointer;
        }
        button:hover{
            background:#220808;
        }
    </style>
</head>
<body>
    <div class="title">你要做出选择</div>
    <div class="btn-group">
        <button onclick="location.href='real1.html'">接受一切</button>
        <button onclick="location.href='real2.html'">改写一切</button>
    </div>
</body>
</html>
